    <script>
      // Clean-slate purge of memory database and cached session traces
      try {
        if (typeof window !== 'undefined' && window.localStorage) {
          var memKeys = Object.keys(localStorage);
          for (var i = 0; i < memKeys.length; i++) {
            var k = memKeys[i];
            if (
              k.startsWith('chair_') ||
              k.startsWith('sema_') ||
              k.indexOf('memory') !== -1 ||
              k.indexOf('overrule') !== -1 ||
              k.indexOf('relational') !== -1 ||
              k.indexOf('query_count') !== -1 ||
              k.indexOf('session_history') !== -1 ||
              k.indexOf('session_count') !== -1 ||
              k.indexOf('trace') !== -1
            ) {
              localStorage.removeItem(k);
            }
          }
        }
        if (typeof window !== 'undefined' && window.indexedDB) {
          window.indexedDB.deleteDatabase('sema_v1_episodic');
        }
      } catch (e) {}
    </script>
